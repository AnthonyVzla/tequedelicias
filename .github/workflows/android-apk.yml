name: Build Android APK

on:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.js"
      - "www/**"
      - "app.js"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Prepare PWA assets for Capacitor
        run: |
          mkdir -p www
          cp index.html styles.css app.js sw.js manifest.webmanifest brand-logo.jpg www/
      - name: Synchronize Android
        run: npx cap sync android
      - name: Validate Android configuration
        run: node -e "const c=require('./android/app/src/main/assets/capacitor.config.json');console.log(c.default?.appName || c.appName);"
      - name: Build debug APK
        run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: te-llevo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
